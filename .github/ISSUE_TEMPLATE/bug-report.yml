name: Documentation bug
description: Report an issue with the public website or documentation.
title: "[Docs] "
labels: [documentation]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what is incorrect, missing, or unclear.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or section
  - type: checkboxes
    id: safety
    attributes:
      label: Public information
      options:
        - label: This report contains no credentials, personal data, leaked material, or members-only content.
          required: true
