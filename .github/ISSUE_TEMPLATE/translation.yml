name: Translation correction
description: Submit verified in-game terminology.
title: "[Translation] "
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: input
    id: english
    attributes:
      label: English term
    validations:
      required: true
  - type: input
    id: translation
    attributes:
      label: Verified in-game translation
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and context
  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: This wording was observed in the game and is not only a machine translation.
          required: true
